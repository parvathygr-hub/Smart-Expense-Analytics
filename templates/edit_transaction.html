<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Edit Transaction</h1>
        <p>Update your transaction details</p>
    </header>

    <main>

        <section class="actions">

            <form method="POST">

                <label for="type">Transaction Type</label>

                <select id="type" name="type" required>

                    <option value="income"
                    {% if transaction.type == "income" %}selected{% endif %}>
                        Income
                    </option>

                    <option value="expense"
                    {% if transaction.type == "expense" %}selected{% endif %}>
                        Expense
                    </option>

                </select>


                <label for="category">Category</label>

                <select id="category" name="category" required>

                    <option value="food"
                    {% if transaction.category == "food" %}selected{% endif %}>
                        Food
                    </option>

                    <option value="transport"
                    {% if transaction.category == "transport" %}selected{% endif %}>
                        Transport
                    </option>

                    <option value="shopping"
                    {% if transaction.category == "shopping" %}selected{% endif %}>
                        Shopping
                    </option>

                    <option value="education"
                    {% if transaction.category == "education" %}selected{% endif %}>
                        Education
                    </option>

                    <option value="entertainment"
                    {% if transaction.category == "entertainment" %}selected{% endif %}>
                        Entertainment
                    </option>

                    <option value="other"
                    {% if transaction.category == "other" %}selected{% endif %}>
                        Other
                    </option>

                </select>


                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ transaction.amount }}"
                    step="0.01"
                    min="0"
                    required
                >


                <label for="date">Date</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ transaction.date }}"
                    required
                >


                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    value="{{ transaction.description }}"
                    required
                >


                <button type="submit">Update Transaction</button>

            </form>

        </section>


        <div class="navigation">

            <a href="/transactions">
                <button>Back to Transactions</button>
            </a>

            <a href="/">
                <button>Dashboard</button>
            </a>

        </div>

    </main>

</body>
</html>
